name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # JDK 25 for :compat:v3 is auto-provisioned by the foojay toolchain resolver.
      - name: Build
        run: ./gradlew build importBan

      - uses: actions/upload-artifact@v4
        with:
          name: DBetterModel
          path: build/libs/DBetterModel-*.jar
